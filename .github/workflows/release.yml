name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      # The daemon's heap comes from gradle.properties; the worker count is Gradle's default
      # (nothing sets org.gradle.workers.max). Do NOT reintroduce
      # ORG_GRADLE_PROJECT_org.gradle.jvmargs / ORG_GRADLE_PROJECT_org.gradle.workers.max here:
      # those define project properties, not build-environment settings, so Gradle ignores them
      # for both settings. GRADLE_OPTS below configures the short-lived launcher JVM only.
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # npm ci, not npm install: package-lock.json is tracked, so the toolchain
        # (commitlint, husky) resolves to pinned versions instead of drifting.
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Android lint
        run: ./gradlew lint --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Security vulnerability scan removed - using Dependabot instead
      # - name: Run security vulnerability scan
      #   run: |
      #     ./gradlew dependencyCheckAnalyze --stacktrace
      #   env:
      #     GITHUB_USERNAME: ${{ github.actor }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug variants
        run: ./gradlew assembleDebug --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/test*/**/*.xml
            **/build/reports/tests/test*/**/*

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml

      # Security scan results upload removed - using Dependabot instead  
      # - name: Upload security scan results
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: security-scan-results
      #     path: |
      #       **/build/reports/dependency-check-report.html
      #       **/build/reports/dependency-check-report.xml

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality-checks

    env:
      # The daemon's heap comes from gradle.properties; the worker count is Gradle's default
      # (nothing sets org.gradle.workers.max). Do NOT reintroduce
      # ORG_GRADLE_PROJECT_org.gradle.jvmargs / ORG_GRADLE_PROJECT_org.gradle.workers.max here:
      # those define project properties, not build-environment settings, so Gradle ignores them
      # for both settings. GRADLE_OPTS below configures the short-lived launcher JVM only.
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Audit Secrets SHA256
        run: |
          echo "=== Secrets SHA256 Audit ==="
          echo "BOT_GITHUB_TOKEN: $(echo -n '${{ secrets.BOT_GITHUB_TOKEN }}' | sha256sum | cut -d' ' -f1)"
          echo "BOT_GPG_PRIVATE_KEY: $(echo -n '${{ secrets.BOT_GPG_PRIVATE_KEY }}' | sha256sum | cut -d' ' -f1)"
          echo "BOT_EMAIL: $(echo -n '${{ secrets.BOT_EMAIL }}' | sha256sum | cut -d' ' -f1)"
          echo "=== End Secrets Audit ==="

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: axeptio-release-bot
          git_committer_email: ${{ secrets.BOT_EMAIL }}

      - name: Configure Git for signed commits
        run: |
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"
          git config --global gpg.program "$(which gpg)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The version the repo declares is the single source of truth, and a release happens only when
      # a human has bumped it. Nothing here infers a version from commit history or tag reachability:
      # the sample app's version deliberately mirrors the SDK version it targets, which no amount of
      # commit analysis can know. An ordinary merge therefore releases nothing, so merge commits no
      # longer need `[skip ci]` to stay safe (MSK-241).
      #
      # Bump both files together with `node scripts/update-version.js <version>` in the PR that
      # targets a new SDK; PR Quality Checks fails a PR that bumps only one of them.
      - name: Resolve declared version
        id: declared
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DECLARED=$(./scripts/declared-version.sh)
          echo "version=$DECLARED" >> "$GITHUB_OUTPUT"

          if gh api "repos/${{ github.repository }}/git/ref/tags/v$DECLARED" >/dev/null 2>&1; then
            echo "v$DECLARED is already released - nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$DECLARED is not released yet - releasing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only a smoke check — nothing here is uploaded or attached to the release — and PR Quality
      # Checks already ran assembleRelease on this code before it merged. Skipping it when there is
      # nothing to release keeps an ordinary merge cheap; `test`, `lint` and assembleDebug still run
      # on every master push in Quality Checks, which gates this job.
      - name: Build Android apps
        if: steps.declared.outputs.changed == 'true'
        run: ./gradlew assembleRelease --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Authenticate git remote for pushes
        if: steps.declared.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          # Checkout above uses persist-credentials: false, so the tag and branch pushes below need
          # the token wired into the remote explicitly.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Generate Changelog
        if: steps.declared.outputs.changed == 'true'
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-user-name: axeptio-release-bot
          git-user-email: ${{ secrets.BOT_EMAIL }}
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          git-push: false
          version: ${{ steps.declared.outputs.version }}
          tag-prefix: 'v'
          output-file: 'CHANGELOG.md'

      - name: Commit Changelog
        if: steps.declared.outputs.changed == 'true' && steps.changelog.outputs.skipped != 'true'
        run: |
          # Restore git config after changelog action changes it
          git config --global user.name "axeptio-release-bot"
          git config --global user.email "${{ secrets.BOT_EMAIL }}"
          git config --global commit.gpgsign true
          
          git add CHANGELOG.md
          git commit -S -m "docs: update CHANGELOG.md for v${{ steps.declared.outputs.version }} [skip ci]"

      - name: Create and Push Tag
        if: steps.declared.outputs.changed == 'true'
        run: |
          # Debug: Show commits that will be pushed
          echo "=== Commits to be pushed ==="
          git log origin/master..HEAD --oneline
          
          # Debug: Check signature status
          echo "=== Signature status ==="
          git log origin/master..HEAD --pretty=format:"%H %G? %GS %GK %s"
          
          # Debug: Verify signatures
          echo "=== Verify signatures ==="
          git log origin/master..HEAD --show-signature
          
          # Create signed tag
          git tag -s v${{ steps.declared.outputs.version }} -m "Release v${{ steps.declared.outputs.version }}"
          
          # Push commits and tags (authentication set up in the Authenticate git remote step)
          git push origin HEAD:master
          git push origin v${{ steps.declared.outputs.version }}

      - name: Create GitHub Release
        if: steps.declared.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          tag_name: v${{ steps.declared.outputs.version }}
          name: v${{ steps.declared.outputs.version }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

  pr-quality-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    env:
      # The daemon's heap comes from gradle.properties; the worker count is Gradle's default
      # (nothing sets org.gradle.workers.max). Do NOT reintroduce
      # ORG_GRADLE_PROJECT_org.gradle.jvmargs / ORG_GRADLE_PROJECT_org.gradle.workers.max here:
      # those define project properties, not build-environment settings, so Gradle ignores them
      # for both settings. GRADLE_OPTS below configures the short-lived launcher JVM only.
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # npm ci, not npm install: package-lock.json is tracked, so the toolchain
        # (commitlint, husky) resolves to pinned versions instead of drifting.
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Fails a PR that bumps versionName without package.json (or the reverse). The release gate on
      # master runs the same script, so catching it here means the mismatch never reaches a release.
      - name: Validate declared version
        run: ./scripts/declared-version.sh

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Run unit tests
        run: ./gradlew test --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Android lint
        run: ./gradlew lint --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all variants
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PR test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-test-results
          path: |
            **/build/test-results/test*/**/*.xml
            **/build/reports/tests/test*/**/*

      - name: Upload PR lint results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-lint-results
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
