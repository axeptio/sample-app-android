name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      # The daemon's heap comes from gradle.properties; the worker count is Gradle's default
      # (nothing sets org.gradle.workers.max). Do NOT reintroduce
      # ORG_GRADLE_PROJECT_org.gradle.jvmargs / ORG_GRADLE_PROJECT_org.gradle.workers.max here:
      # those define project properties, not build-environment settings, so Gradle ignores them
      # for both settings. GRADLE_OPTS below configures the short-lived launcher JVM only.
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # npm ci, not npm install: package-lock.json is tracked, so the toolchain
        # (semantic-release, commitlint, husky) resolves to pinned versions instead of drifting.
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Android lint
        run: ./gradlew lint --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Security vulnerability scan removed - using Dependabot instead
      # - name: Run security vulnerability scan
      #   run: |
      #     ./gradlew dependencyCheckAnalyze --stacktrace
      #   env:
      #     GITHUB_USERNAME: ${{ github.actor }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug variants
        run: ./gradlew assembleDebug --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/test*/**/*.xml
            **/build/reports/tests/test*/**/*

      - name: Upload lint results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-results
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml

      # Security scan results upload removed - using Dependabot instead  
      # - name: Upload security scan results
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: security-scan-results
      #     path: |
      #       **/build/reports/dependency-check-report.html
      #       **/build/reports/dependency-check-report.xml

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality-checks

    env:
      # The daemon's heap comes from gradle.properties; the worker count is Gradle's default
      # (nothing sets org.gradle.workers.max). Do NOT reintroduce
      # ORG_GRADLE_PROJECT_org.gradle.jvmargs / ORG_GRADLE_PROJECT_org.gradle.workers.max here:
      # those define project properties, not build-environment settings, so Gradle ignores them
      # for both settings. GRADLE_OPTS below configures the short-lived launcher JVM only.
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Audit Secrets SHA256
        run: |
          echo "=== Secrets SHA256 Audit ==="
          echo "BOT_GITHUB_TOKEN: $(echo -n '${{ secrets.BOT_GITHUB_TOKEN }}' | sha256sum | cut -d' ' -f1)"
          echo "BOT_GPG_PRIVATE_KEY: $(echo -n '${{ secrets.BOT_GPG_PRIVATE_KEY }}' | sha256sum | cut -d' ' -f1)"
          echo "BOT_EMAIL: $(echo -n '${{ secrets.BOT_EMAIL }}' | sha256sum | cut -d' ' -f1)"
          echo "=== End Secrets Audit ==="

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: axeptio-release-bot
          git_committer_email: ${{ secrets.BOT_EMAIL }}

      - name: Configure Git for signed commits
        run: |
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"
          git config --global gpg.program "$(which gpg)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android apps
        run: ./gradlew assembleRelease --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Get Next Version
        id: get_version
        uses: PaulHatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          change_path: "."
          namespace: ""
          bump_each_commit: false
          search_commit_body: false
          user_format_type: "json"
          enable_prerelease_mode: false

      - name: Check and Clean Existing Tag
        if: steps.get_version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          # Set up authentication for tag operations
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          
          # Check if tag exists locally
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.get_version.outputs.version }} exists locally, deleting..."
            git tag -d "v${{ steps.get_version.outputs.version }}"
          fi
          
          # Check if tag exists remotely and delete it
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.get_version.outputs.version }}"; then
            echo "Tag v${{ steps.get_version.outputs.version }} exists remotely, deleting..."
            git push origin ":refs/tags/v${{ steps.get_version.outputs.version }}"
          fi

      - name: Update versions using existing script
        if: steps.get_version.outputs.changed == 'true'
        run: |
          # Update package.json version (no git operations)
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version
          
          # Update Android version in the Kotlin sample app
          node scripts/update-version.js ${{ steps.get_version.outputs.version }}

          # Commit all version updates in one signed commit
          git add package.json package-lock.json samplekotlin/build.gradle.kts
          git commit -S -m "chore(release): v${{ steps.get_version.outputs.version }} [skip ci]"

      - name: Generate Changelog
        if: steps.get_version.outputs.changed == 'true'
        id: changelog
        uses: TriPSs/conventional-changelog-action@3c4970b6573374889b897403d2f1278c395ea0df # v5.4.0
        with:
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-user-name: axeptio-release-bot
          git-user-email: ${{ secrets.BOT_EMAIL }}
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          git-push: false
          version: ${{ steps.get_version.outputs.version }}
          tag-prefix: 'v'
          output-file: 'CHANGELOG.md'

      - name: Commit Changelog
        if: steps.get_version.outputs.changed == 'true' && steps.changelog.outputs.skipped != 'true'
        run: |
          # Restore git config after changelog action changes it
          git config --global user.name "axeptio-release-bot"
          git config --global user.email "${{ secrets.BOT_EMAIL }}"
          git config --global commit.gpgsign true
          
          git add CHANGELOG.md
          git commit -S -m "docs: update CHANGELOG.md for v${{ steps.get_version.outputs.version }} [skip ci]"

      - name: Create and Push Tag
        if: steps.get_version.outputs.changed == 'true'
        run: |
          # Debug: Show commits that will be pushed
          echo "=== Commits to be pushed ==="
          git log origin/master..HEAD --oneline
          
          # Debug: Check signature status
          echo "=== Signature status ==="
          git log origin/master..HEAD --pretty=format:"%H %G? %GS %GK %s"
          
          # Debug: Verify signatures
          echo "=== Verify signatures ==="
          git log origin/master..HEAD --show-signature
          
          # Create signed tag
          git tag -s v${{ steps.get_version.outputs.version }} -m "Release v${{ steps.get_version.outputs.version }}"
          
          # Push commits and tags (authentication already set up in Check and Clean Existing Tag step)
          git push origin HEAD:master
          git push origin v${{ steps.get_version.outputs.version }}

      - name: Create GitHub Release
        if: steps.get_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

  pr-quality-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    env:
      # The daemon's heap comes from gradle.properties; the worker count is Gradle's default
      # (nothing sets org.gradle.workers.max). Do NOT reintroduce
      # ORG_GRADLE_PROJECT_org.gradle.jvmargs / ORG_GRADLE_PROJECT_org.gradle.workers.max here:
      # those define project properties, not build-environment settings, so Gradle ignores them
      # for both settings. GRADLE_OPTS below configures the short-lived launcher JVM only.
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # npm ci, not npm install: package-lock.json is tracked, so the toolchain
        # (semantic-release, commitlint, husky) resolves to pinned versions instead of drifting.
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Run unit tests
        run: ./gradlew test --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Android lint
        run: ./gradlew lint --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all variants
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PR test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: pr-test-results
          path: |
            **/build/test-results/test*/**/*.xml
            **/build/reports/tests/test*/**/*

      - name: Upload PR lint results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: pr-lint-results
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
